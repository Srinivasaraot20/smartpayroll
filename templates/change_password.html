{% extends 'base.html' %}

{% block title %}Change Password - PayrollPro{% endblock %}

{% block content %}
<style>
    .auth-bg {
        background-color: #0F172A;
        color: #F8FAFC;
        height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-card {
        background-color: #1E293B;
        border: 1px solid #334155;
        border-radius: 0.75rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }
    .form-control-custom {
        background-color: #0F172A;
        border: 1px solid #334155;
        color: #F8FAFC;
    }
    .form-control-custom:focus {
        background-color: #0F172A;
        border-color: #38BDF8;
        color: #F8FAFC;
        box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
    .text-muted-custom {
        color: #94A3B8;
    }
    .text-accent-blue {
        color: #38BDF8;
    }
</style>

<div class="auth-bg">
    <div class="card auth-card p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-white"><i class="bi bi-shield-lock-fill text-accent-blue me-2"></i>Change Password</h3>
            <p class="text-muted-custom small mb-0">For security, you must update your temporary login credentials before entering the application.</p>
        </div>
        
        <form method="POST" action="{{ url_for('change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-3">
                <label for="new_password" class="form-label small text-muted-custom">New Password</label>
                <input type="password" name="new_password" id="new_password" class="form-control form-control-custom" placeholder="Min 6 characters" required>
            </div>
            
            <div class="mb-4">
                <label for="confirm_password" class="form-label small text-muted-custom">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control form-control-custom" placeholder="Re-enter new password" required>
            </div>
            
            <button type="submit" class="btn btn-primary bg-gradient w-100 py-2">
                Update Password & Proceed
            </button>
        </form>
    </div>
</div>
{% endblock %}
